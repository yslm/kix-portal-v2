<!doctype html>
<html>
  <head>
    <title>KiX Ads Manager · Merchant cockpit</title>
    <script>
      ;(function () {
        try {
          var RTL = ['ar', 'he', 'fa', 'ur']
          var qs = new URLSearchParams(window.location.search).get('lang')
          var stored = (function () {
            try {
              return localStorage.getItem('kix_locale')
            } catch (_) {
              return null
            }
          })()
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en'
          var loc = qs || stored || nav || 'en'
          var primary = String(loc).split('-')[0].toLowerCase()
          if (RTL.indexOf(primary) >= 0) {
            document.documentElement.setAttribute('dir', 'rtl')
            document.documentElement.setAttribute('lang', loc)
          }
        } catch (_) {
          /* no-op · runtime will fix later */
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Art Design Pro - A modern admin dashboard template built with Vue 3, TypeScript, and Element Plus."
    />
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.ico" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
